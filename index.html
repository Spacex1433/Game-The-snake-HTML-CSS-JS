<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Неоновая Змейка</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-panel">
  <div id="score">Очки: 0</div>
  <div id="title">The snake</div>
  <button id="restartBtn">Перезапуск</button>
</div>
<!---мобильное урав--->
 <div class="mobile-controls">
  <button class="control up" data-direction="up">▲</button>
   <div class="middle-controls">
    <button class="control left" data-direction="left">◀</button>
    <button class="control down" data-direction="down">▼</button>
    <button class="control right" data-direction="right">▶</button>
  </div>
</div>




  
<canvas id="game" width="800" height="600"></canvas>

<script src="script.js"></script>
</body>
</html>
